<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B6914"/>
      <stop offset="25%"  stop-color="#C9A84C"/>
      <stop offset="50%"  stop-color="#F0D080"/>
      <stop offset="75%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9A7A2E"/>
      <stop offset="40%"  stop-color="#E8CB7A"/>
      <stop offset="100%" stop-color="#9A7A2E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="800" height="800" fill="#080808"/>

  <!-- Wreath: 32 outer leaves in a circle, radius ~195 -->
  <g transform="translate(400, 340)" filter="url(#glow)">

    <!-- Outer ring of leaves (32 leaves) -->
    <g fill="url(#gold1)">
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(0)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(11.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(22.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(33.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(45)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(56.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(67.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(78.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(90)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(101.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(112.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(123.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(135)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(146.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(157.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(168.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(180)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(191.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(202.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(213.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(225)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(236.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(247.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(258.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(270)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(281.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(292.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(303.75)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(315)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(326.25)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(337.5)"/>
      <ellipse cx="0" cy="-195" rx="9" ry="22" transform="rotate(348.75)"/>
    </g>

    <!-- Middle ring of leaves (24 leaves), radius ~148, offset by half step -->
    <g fill="url(#gold2)" opacity="0.85">
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(7.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(22.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(37.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(52.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(67.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(82.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(97.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(112.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(127.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(142.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(157.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(172.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(187.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(202.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(217.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(232.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(247.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(262.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(277.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(292.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(307.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(322.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(337.5)"/>
      <ellipse cx="0" cy="-148" rx="7" ry="17" transform="rotate(352.5)"/>
    </g>

    <!-- Inner ring of leaves (16 leaves), radius ~105 -->
    <g fill="url(#gold1)" opacity="0.65">
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(0)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(22.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(45)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(67.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(90)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(112.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(135)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(157.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(180)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(202.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(225)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(247.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(270)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(292.5)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(315)"/>
      <ellipse cx="0" cy="-105" rx="5.5" ry="13" transform="rotate(337.5)"/>
    </g>

  </g>

  <!-- ADERA HOLDINGS text -->
  <text
    x="400"
    y="600"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    font-weight="400"
    letter-spacing="20"
    fill="url(#gold1)"
  >ADERA HOLDINGS</text>

  <!-- Thin gold rule below text -->
  <line x1="160" y1="630" x2="640" y2="630" stroke="url(#gold2)" stroke-width="1" opacity="0.5"/>
</svg>
