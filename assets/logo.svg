<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880">
  <defs>
    <linearGradient id="lg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#6B4A0E"/>
      <stop offset="28%"  stop-color="#C8961E"/>
      <stop offset="50%"  stop-color="#F0D060"/>
      <stop offset="72%"  stop-color="#C8961E"/>
      <stop offset="100%" stop-color="#6B4A0E"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6B4A0E"/>
      <stop offset="30%"  stop-color="#C8961E"/>
      <stop offset="52%"  stop-color="#F0D060"/>
      <stop offset="74%"  stop-color="#C8961E"/>
      <stop offset="100%" stop-color="#6B4A0E"/>
    </linearGradient>
    <!-- Single leaf: origin at stem base, tip points up -->
    <path id="lf" d="M0,0 C-7,-18 -10,-38 0,-54 C10,-38 7,-18 0,0Z" fill="url(#lg)"/>
  </defs>

  <!-- 20 leaf clusters around centre (400,330), radius 185 -->
